<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b7a42">
  <title>Hors ligne — Univers Gourmand</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #fff; color: #12261b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 340px; }
    img { width: 72px; height: 72px; }
    h1 { margin: 18px 0 8px; font-size: 22px; }
    p { margin: 0 0 22px; color: #5d6d63; line-height: 1.55; }
    button { height: 46px; padding: 0 24px; border: 0; border-radius: 10px; background: #0b7a42; color: #fff; font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="assets/images/logo.svg" alt="">
    <h1>Pas de connexion</h1>
    <p>Impossible de joindre le restaurant pour le moment. Vérifiez votre connexion Internet, puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
